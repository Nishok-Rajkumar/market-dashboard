name: Daily market data

on:
  # Started by the Timekeeper workflow at 8:15 PM (full), 11:15 PM (news) and 8:30 AM IST (morning), Mon–Fri.
  # GitHub's own schedule ran these 2–7 hours late, so it is no longer used here.
  workflow_dispatch:
    inputs:
      mode:
        description: "full = all data, news = headlines + brief, morning = news + brief + global prices"
        type: choice
        options: [full, news, morning]
        default: full

permissions:
  contents: write   # commit the new data
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pipeline/**/*.py"

      - name: Run pipeline
        env:
          TZ: Asia/Kolkata
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          uv run pipeline/run_daily.py --mode "${{ github.event.inputs.mode || 'full' }}"

      - name: Commit data
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M') IST"
          git push

      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
