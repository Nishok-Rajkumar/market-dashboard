name: Daily market data

on:
  # Times are UTC (IST = UTC + 5:30). Odd minutes avoid GitHub's top-of-the-hour queue delays.
  schedule:
    - cron: "45 14 * * 1-5"   # 8:15 PM IST — full run; NSE's last file (F&O participant OI) is out by ~8 PM
    - cron: "45 17 * * 1-5"   # 11:15 PM IST — news + brief: late results, US data and US open
    - cron: "0 3 * * 1-5"     # 8:30 AM IST — news + brief + overnight global prices before the open
  workflow_dispatch:
    inputs:
      mode:
        description: "full = all data, news = headlines + brief, morning = news + brief + global prices"
        type: choice
        options: [full, news, morning]
        default: full

permissions:
  contents: write   # commit the new data
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pipeline/**/*.py"

      - name: Run pipeline
        env:
          TZ: Asia/Kolkata
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "45 17 * * 1-5") MODE=news ;;
              "0 3 * * 1-5")   MODE=morning ;;
              *)               MODE=full ;;
            esac
          fi
          uv run pipeline/run_daily.py --mode "$MODE"

      - name: Commit data
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M') IST"
          git push

      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
